id: grep-only-matching
track: search-find
level: 3
title: Just the matching part
prompt: >
  hosts pairs an IP address with a name, and has comments and blank lines
  too. Print only the addresses, in the order they appear.
fixture: configs
expected_stdout_file: expected/grep-only-matching.txt
match: exact
teaches: [grep]
must_use: []
forbid: []
reference_solution: grep -o '^[0-9][0-9.]*' hosts
solution_notes: >
  -o prints the matched text instead of the whole line, which turns grep
  into an extractor. It is the reach-for tool when the thing you want is not
  a whole field and cut cannot see it.
hints:
  - A flag makes grep print what matched rather than the line it was on.
  - grep -_ '^[0-9][0-9.]*' hosts
