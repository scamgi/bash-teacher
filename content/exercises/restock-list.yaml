id: restock-list
track: real-world
level: 4
title: What needs restocking?
prompt: >
  stock.tsv is tab-separated with a header and the columns sku, name, qty
  and warehouse. Print the quantity and the name of every item with fewer
  than 100 in stock, lowest quantity first.
fixture: inventory
expected_stdout_file: expected/restock-list.txt
match: exact
teaches: [awk, sort]
must_use: []
forbid: []
reference_solution: awk -F'\t' 'NR > 1 && $3 < 100 { print $3, $2 }' stock.tsv | sort -n
solution_notes: >
  -F'\t' tells awk the fields are tab-separated, which matters the moment a
  field contains a space. NR is the record number, so `NR > 1` is how a
  header row gets skipped without a separate tail.
hints:
  - Set the field separator to a tab, skip the header by its record number, and filter on the quantity before sorting numerically.
  - awk -F'\t' 'NR _ 1 && $_ < 100 { print $3, $2 }' stock.tsv | sort -_
